<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Membaca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-blue-50 text-center p-4">
    <h1 class="text-2xl font-bold mb-4">Belajar Membaca</h1>

    <div id="app"></div>

    <!-- Floating Menu -->
    <div class="fixed bottom-6 left-4 z-50 flex items-center gap-3">
      <!-- FAB -->
      <button
        id="fabButton"
        class="w-16 h-16 rounded-full bg-yellow-400 text-white shadow-xl hover:bg-yellow-500 transition-all duration-300 flex items-center justify-center"
      >
        <i class="fas fa-bars text-xl"></i>
      </button>

      <!-- Menu -->
      <div
        id="fabMenu"
        class="flex flex-row gap-3 opacity-0 pointer-events-none -translate-x-4 transition-all duration-300"
      >
        <button
          class="menu-item bg-white shadow-lg rounded-full px-5 py-3 hover:bg-yellow-100"
          data-course="0"
        >
          Beranda
        </button>

        <button
          class="menu-item bg-white shadow-lg rounded-full px-5 py-3 hover:bg-yellow-100"
          data-course="1"
        >
          Mengenal Huruf
        </button>

        <button
          class="menu-item bg-white shadow-lg rounded-full px-5 py-3 hover:bg-yellow-100"
          data-course="2"
        >
          Mengenal Angka
        </button>

        <button
          class="menu-item bg-white shadow-lg rounded-full px-5 py-3 hover:bg-yellow-100"
          data-course="3"
        >
          Mengeja
        </button>

        <button
          class="menu-item bg-white shadow-lg rounded-full px-5 py-3 hover:bg-yellow-100"
          data-course="4"
        >
          Berhitung
        </button>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
