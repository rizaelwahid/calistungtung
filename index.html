<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calistungtung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body class="bg-blue-50 text-center p-4">
    <h1 class="text-2xl font-bold mb-4">Calistungtung</h1>

    <div id="app"></div>

    <!-- Floating Menu -->
    <div
      id="fabMenu"
      class="fixed left-[5.5rem] bottom-4 z-[100] max-w-[calc(100vw-6.5rem)] flex flex-wrap gap-2 opacity-0 pointer-events-none -translate-x-4 transition-all duration-300"
    >
      <button
        class="menu-item bg-white shadow-lg rounded-full px-5 py-3 whitespace-nowrap hover:bg-yellow-200"
        data-course="0"
      >
        Beranda
      </button>

      <button
        class="menu-item bg-white shadow-lg rounded-full px-5 py-3 whitespace-nowrap hover:bg-pink-200"
        data-course="1"
      >
        Mengenal Huruf
      </button>

      <button
        class="menu-item bg-white shadow-lg rounded-full px-5 py-3 whitespace-nowrap hover:bg-red-200"
        data-course="2"
      >
        Mengenal Angka
      </button>

      <button
        class="menu-item bg-white shadow-lg rounded-full px-5 py-3 whitespace-nowrap hover:bg-green-200"
        data-course="3"
      >
        Mengeja
      </button>

      <button
        class="menu-item bg-white shadow-lg rounded-full px-5 py-3 whitespace-nowrap hover:bg-blue-200"
        data-course="4"
      >
        Berhitung
      </button>
    </div>

    <!-- FAB -->
    <button
      id="fabButton"
      class="fixed left-4 bottom-4 z-[101] w-16 h-16 shrink-0 rounded-full bg-red-300 text-white shadow-xl hover:bg-red-500 transition-all duration-300 flex items-center justify-center"
    >
      <i class="fas fa-bars text-xl"></i>
    </button>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
